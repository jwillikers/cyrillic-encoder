name: Check desktop file
"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - '**.nix'
      - .github/workflows/desktop-file-validate.yaml
      - flake.lock
      - packaging/com.jwillikers.CyrillicEncoder.desktop

permissions:
  contents: read
  pull-requests: read

jobs:
  desktop-file-validate:
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - '**.nix'
              - .github/workflows/desktop-file-validate.yaml
              - flake.lock
              - packaging/com.jwillikers.CyrillicEncoder.desktop
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      - name: Check the desktop file
        if: steps.gate.outputs.run == 'true'
        run: nix develop --command desktop-file-validate packaging/com.jwillikers.CyrillicEncoder.desktop
